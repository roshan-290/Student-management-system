<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <h1>🎓 Student Management System</h1>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="card">
            <h2 id="totalStudents">0</h2>
            <p>Total Students</p>
        </div>
    </div>

    <!-- Form -->
    <div class="form-container">

        <h2>Add Student</h2>

        <form id="studentForm">

            <input
                type="text"
                id="studentId"
                placeholder="Student ID"
                required>

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required>

            <input
                type="number"
                id="age"
                placeholder="Age"
                required>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <input
                type="text"
                id="course"
                placeholder="Course"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required>

            <button type="submit">
                Add Student
            </button>

        </form>

    </div>

    <!-- Search -->

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search Student...">
    </div>

    <!-- Student Table -->

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Course</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>

</div>

<script src="first.js"></script>

</body>
</html>
